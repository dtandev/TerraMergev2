name: Baseline Check

on:
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the micromamba env stays active across steps

    steps:
      - uses: actions/checkout@v4

      # GDAL 3.13 has no manylinux wheels and its build must match libgdal, so it cannot
      # be pip-installed on a bare runner. conda-forge ships gdal 3.13 built for Python
      # 3.12 — this sidesteps both the source build and the Python 3.14 that the official
      # GDAL 3.13 containers force (this project caps Python at <3.13 via h3 3.7.7).
      - name: Set up conda env with GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          create-args: >-
            python=3.12
            gdal=3.13
            pip

      - name: Install uv
        run: pip install uv

      - name: Install project and dev dependencies
        # GDAL is provided by conda-forge above, so the `local` extra (which carries the
        # pinned pip GDAL for local dev) is intentionally NOT installed here.
        run: uv pip install --python "$CONDA_PREFIX/bin/python" -e . --group dev

      - name: Lint & format check
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate baseline files exist
        run: |
          echo "Checking required baseline files..."
          for f in product.yaml README.md CHANGELOG.md justfile .env-example .pre-commit-config.yaml; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            else
              echo "✅ Found: $f"
            fi
          done
          if [ ! -d "src" ] || [ ! -d "tests" ] || [ ! -d "examples" ]; then
            echo "❌ Missing required directory (src/, tests/, or examples/)"
            exit 1
          fi
          echo "✅ All baseline files present"
