# === CONFIG ROOT (minimal) ===
defaults:
  - prepare: default
  - features: default
  - pipeline: make_hexagons
  - dataset: default
  - model: default
  - _self_


data:
  # Wartości pochodzą z .env (patrz .env-example) — nadpisujesz też z CLI: data.base_dir=/mnt/c/...
  base_dir: "${oc.env:TERRAMERGE_BASE_DIR}"
  duckdb_path: "${oc.env:TERRAMERGE_DUCKDB_PATH,artifacts/duckdb/egib.duckdb}"
  transactions_path: "${oc.env:TERRAMERGE_TRANSACTIONS_PATH,artifacts/parquet/transakcje.parquet}"
  mpzp_mapping_csv: "${oc.env:TERRAMERGE_MPZP_MAPPING_CSV,artifacts/csv/mpzp.csv}"

# Inicjalizacja DuckDB (opcja przyspieszająca operacje na Parquet)
duckdb:
  init: true # uruchomić raz, potem nie ma potrzeby
  schema: "egib"
  threads: null
  memory_limit: null # "8GB"

wfs:
  url: "https://integracja.e-mapa.net/cgi-bin/mpzp"
  version: "1.1.0"          # spróbuj 2.0.0; jeśli serwer marudzi, zjedź do 1.1.0
  srsname: "EPSG:2180"
  timeout_s: 60
  layers:
    - typename: "ms:przeznaczenia"
      geom_field: "geometry"
      alias: "przeznaczenia"   # użyte w nazwie pliku i kolumnie 'wfs_layer'
    - typename: "ms:plany"
      geom_field: "geometry"
      alias: "plany"


hydra:
  run:
    dir: artifacts/reports/${now:%Y%m%d_%H%M%S}
  output_subdir: null

logging:
  console_level: INFO
  file_level: INFO
  log_dir: artifacts/logs
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <7}</level> | <cyan>{name}:{function}:{line}</cyan> | <level>{message}</level>"
