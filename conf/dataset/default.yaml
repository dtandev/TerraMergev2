# conf/dataset/dataset_preparation.yaml

enabled: true

resolution: r8

labels_for_parcels:
  enabled: true
  table: "hex.DzialkaEwidencyjna_${dataset.resolution}"
  out_table: "labels.ParcelLabels_${dataset.resolution}"
  parcels_split_col_name: 'n_parcel'
  # gf_area_ha_mean: geometry-derived mean parcel area [ha], aggregated from egib.GeometricFeatures.
  # Always present and consistent across GDB/GML/SHP sources (unlike the old Esri "shape_area_mean",
  # which only exists in GDB years). eps_abs is therefore in HECTARES: 0.01 ha == 100 m² (the prior
  # threshold). A split is flagged when the hex mean parcel area drops by more than eps_abs ha.
  mean_area_col: "gf_area_ha_mean"
  area_conservation_tol: 0.005
  eps_abs: 0.01
  extra_horizon: 5

labels_for_uzg:
  enabled: true
  table: "hex.kug_${dataset.resolution}"
  out_table: "labels.kugLabels_${dataset.resolution}"
  years_ahead: 3
  area_conservation_tol: 0.01
  agri_classes: ["uzg_R_share", "sum_agri"]
  share_B_col: "uzg_B_share"
  sum_col: "sum_uzg"
  extra_horizon: 5

calculate_neighborhood:
  enabled: true
  # Core hex tables that are always built. Transakcje is still optional (external transactions
  # parquet, step disabled), so its table stays out until that step is enabled — listing a table
  # whose step is off makes the merge fail with "table does not exist". MPZP is now enabled
  # (WFS + symbol mapping), so hex.mpzp is included.
  tables_to_split:
    - "hex.DzialkaEwidencyjna_${dataset.resolution}"
    - "hex.kug_${dataset.resolution}"
    - "hex.mpzp_${dataset.resolution}"
  proxy_cols: ["split_proxy"]
  keys: ["hex_id","year"]
  table_with_labels: "labels.ParcelLabels_${dataset.resolution}" # "labels.kugLabels_${dataset.resolution}_sum_agri", "labels.kugLabels_${dataset.resolution}_uzg_R_share"
  categorical_cols: ["jednostka"]
  geom_col: "geometry"
  hex_id_col: "hex_id"
  year_col: "year"
  R_values: [1, 2, 3] # R_values
  rolling: true   # True: disks (<=R); False: exact rings (==R)
  min_neighbors: 4
  prefix: "nbr"
  out_table: dataset.Parcels_neighborhood_${dataset.resolution}   # !!! IMPORTANT: Update this to match your output table naming convention


prune_features:
  enabled: false
  protected_cols:
    - "year"
    - "hex_id"
    - "geometry"
    - "jednostka"
  drop_high_nan: true
  high_nan_threshold: 0.7

  drop_constant: true
  quasi_constant_unique_ratio: 0.05

  drop_quasi_constant: true

  drop_duplicate_cols: true

  drop_high_corr: true
  corr_threshold: 0.99
  corr_method: "pearson"

  numeric_only_for_corr: true
  return_report: true

join_y_label:
  enabled: true
  y_label_col: "y_next" #y_next_2, y_next_3
