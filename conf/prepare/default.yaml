# conf/pipeline/prepare.yaml

# Master switch na etap “prepare” (sprzątanie + ekstrakcja)
enabled: false

# 1) Sprzątanie katalogów
clean:
  enabled: true
  remove_dir_names: ["swde", "gml", "shp"]


# 2) Ekstrakcja warstw poligonowych do Parquet
extract:
  enabled: true

# Parametry eksportu (czytane przez run_prepare_data)
output_subdir: "parquets"           # base_dir / parquets / ...
output_filename: "input_data.parquet"
uppercase_geometry: true
rename_legacy_2020: true


# 3) Scalanie warstw według mapy
merge:
  enabled: true
  overwrite: true   # jeśli true → nadpisuje kolidujące pliki

# Mapa nazw (docelowa_warstwa: [lista_aliasów_źródłowych])
layer_name_map:
  Budynek: ["EGB_Budynek", "EGB_BudynekPOLYGON", "G5G_BUD"]
  DzialkaEwidencyjna: ["EGB_DzialkaEwidencyjna", "EGB_DzialkaEwidencyjnaPOLYGON", "G5G_DZE"]
  JednostkaEwidencyjna: ["EGB_JednostkaEwidencyjna", "G5G_JEW"]
  KonturKlasyfikacyjny: ["EGB_KonturKlasyfikacyjny", "G5G_KKL"]
  KonturUzytkuGruntowego: ["EGB_KonturUzytkuGruntowego", "G5G_UZG"]
  ObrebEwidencyjny: ["EGB_ObrebEwidencyjny", "G5G_OBR"]
  ObiektTrwaleZwiazanyZBudynkiem: ["EGB_ObiektTrwaleZwiazanyZBudynkiemPOLYGON"]
  ObszarZabudowany: ["G5G_OZN"]
  RodzajST: ["G5G_RST"]


# 4) CZYSZCZENIE DANYCH — utrwalenie w GeoParquet (NADPISUJE pliki)
clean_dataset:
  enabled: true
  overwrite: true        # jeśli chcesz nadpisywać
  write_duckdb: true   # czy zapisywać z użyciem DuckDB (szybsze dla dużych plików)
  # które warstwy czyścić (nazwy docelowe katalogów w out_subdir)
  layers: ["DzialkaEwidencyjna"]
  # opcjonalnie zawęź do wybranych jednostek (nazwy podkatalogów w out_subdir); [] = wszystkie
  units: []
  apply:
    lowercase: true              # zamień nazwy kolumn na lower
    crs_target: "EPSG:2180"      # null → pierwszy napotkany CRS staje się referencyjny
    drop_columns: ["G5NOS", "G5WRT", "G5DWR", "G5PEW", "G5RZN", "G5DWW", "G5DTW", "G5DTU", "ID", "IDR", "ST_OBJ", "G5IDR", "G5DZP"]  # jeśli chcesz bezpiecznie zrzucić nadmiarowe kolumny
