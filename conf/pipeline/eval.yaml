stage: eval
stages:
  - evaluate_model

inputs:
  model_file: ${contracts.model_file}
  features_selected: ${contracts.features_selected_file}

evaluation:
  split_by: time          # time | group | random
  test_period: "2024-01:2024-12"
  group_col: hex_cell
  test_size: 0.2

reports:
  dir: ${contracts.eval_report_dir}
  pr: true
  roc: true
  calibration: true
  confusion_at_best_threshold: true

alerts:
  min_ap: 0.30
  drop_warn_pp: 5

logging:
  summary: ${hydra:run.dir}/eval_summary.json
