# Example of conf/data/fast.yaml with the machine-specific absolute path blanked out.
# This is a Hydra "fast" data profile for quick local testing on a smaller EGIB directory.

# conf/data/fast.yaml
# @package data

profile: fast

runtime:
  sample_rows: 100000  # quick sampling for fast local runs

base_dir: "TODO: set path"   # smaller/testing EGIB base directory
input_glob: "**/*.gdb"
out_subdir: "parquets"
output_filename: "data_input.parquet"
overwrite: false
only_valid_geometries: true
